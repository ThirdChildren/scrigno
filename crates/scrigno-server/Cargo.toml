[package]
name = "scrigno-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["net", "fs", "time"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
object_store = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# futures-util: StreamExt::next() to drain the request body one chunk at a time while hashing
# and forwarding to object_store, without ever buffering the whole blob (already a transitive
# dependency of axum/hyper; this just names it so our code can use it directly).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
reqwest = { workspace = true }
