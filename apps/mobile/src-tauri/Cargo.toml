[workspace]

[package]
name = "mobile"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# File-open dialog for `doc_add_from_path` (frontend calls it to get a path; wired here for
# capability/permission configuration and so the command surface is testable from Rust alone).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async mutex (safe to hold across `.await`, unlike `std::sync::Mutex`) for `AppState`'s vault
# slot, plus the periodic timer driving the inactivity auto-lock task.
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
scrigno-client = { path = "../../../crates/scrigno-client" }
# Only to name `scrigno_core::meta::DocMeta` as `doc_get_meta`'s return type; scrigno-client
# returns it but doesn't re-export it, and it's already a transitive dependency via the path dep
# above, so this adds no new code, only a direct name for an existing type in the graph.
scrigno-core = { path = "../../../crates/scrigno-core" }
# `SecretString` for passphrase/token args before handing them to scrigno-client.
secrecy = "0.10"
uuid = { version = "1.26", features = ["v7", "serde"] }
# Decodes `DocMeta.thumb`'s base64 JPEG for `doc_thumb`'s binary response.
base64 = "0.22"
# Guesses a file's MIME type from its extension for `doc_add_from_path`/`doc_share`.
mime_guess = "2.0"
# `ts-rs`-exports this crate's own `AppError`/`VaultStatus`/`Settings` to
# `apps/mobile/src/bindings/`, mirroring `scrigno-client`'s own `ts-export` feature.
ts-rs = { version = "12.0", optional = true }
# `AppHandle::fs()` (`FsExt`) reads a path/URI uniformly on every platform: plain `std::fs` on
# desktop, and — the reason this is added in M5 — Android `content://` URIs (from the dialog
# plugin's picker) via the native `ContentResolver`, which `std::fs::File::open` cannot do at
# all. Used only from Rust (`commands::doc_add_from_path`), never exposed to the webview: no
# `fs:*` capability is granted (see `capabilities/default.json`'s doc comment).
tauri-plugin-fs = "2"
# Zeroizes the plaintext buffer `doc_share` (M5) writes to the cache dir before it's dropped —
# `CLAUDE.md`: "Zeroize every buffer that held key material or plaintext."
zeroize = "1"

# Mobile-only native plugins (`docs/CRYPTO.md §5.2`, `doc_share`): both crates are useless on
# desktop (`tauri-plugin-biometric` is `#![cfg(mobile)]` at its own crate root; `vault.stronghold`
# is a mobile/Android quick-unlock concept, see `src/quick_unlock.rs`), so they are scoped to the
# mobile targets here rather than depended on unconditionally — keeps them out of the desktop
# build graph entirely, not just out of desktop's compiled code.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
# Used as a plain Rust library (`tauri_plugin_stronghold::stronghold::Stronghold`), never
# registered as a Tauri plugin/exposed to the webview — see `src/quick_unlock.rs`'s module docs
# for why (MK never leaves the device unwrapped; no reason to give JS a bridge to key storage).
tauri-plugin-stronghold = "2"
# Generates the 32-byte random "device secret" that protects the Stronghold snapshot
# (`docs/CRYPTO.md §5.2`).
rand = "0.9"

[features]
ts-export = ["dep:ts-rs"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
